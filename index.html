<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Laporan Harian SPPG Batu Tulis 02</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071e49">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPPG Batu Tulis 02">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#071e49;overflow:hidden}
  #app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);width:100%;height:auto;border:0;background:#fff}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#071e49;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;transition:opacity .3s}
  #splash img{width:112px;height:112px}
  #splash b{font-size:15px;letter-spacing:.3px}
  #msg{font-size:13px;opacity:.85;max-width:320px;line-height:1.5}
  #fallback{font-size:13px;color:#fff}
  #fallback[hidden]{display:none}
</style>
</head>
<body>
<iframe id="app" title="Laporan Harian SPPG Batu Tulis 02"
  allow="fullscreen; camera; geolocation; clipboard-read; clipboard-write; web-share"></iframe>
<div id="splash">
  <img src="icon-192.png" alt="Logo BGN">
  <b>LAPORAN HARIAN<br>SPPG BATU TULIS 02</b>
  <div id="msg">Memuat aplikasi...</div>
  <a id="fallback" hidden>Terlalu lama? Buka langsung</a>
</div>
<script>
  /* ====== SATU-SATUNYA YANG PERLU DIISI ======
     Tempel alamat aplikasi Apps Script Anda (yang berakhiran /exec) di antara tanda kutip. */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwz6S58ljGkkv7mKTOnhgZf2QD2HnhkJx1k6E5QX2kPsiXiHuVULON5VhXDvN2IZ1tF8g/exec';
  /* =========================================== */

  (function () {
    var frame = document.getElementById('app');
    var splash = document.getElementById('splash');
    var msg = document.getElementById('msg');
    var fb = document.getElementById('fallback');

    if (APP_URL.indexOf('https://script.google.com/') !== 0) {
      msg.textContent = 'Alamat aplikasi belum diisi. Buka file index.html lalu isi APP_URL.';
      return;
    }
    fb.href = APP_URL;
    frame.addEventListener('load', function () {
      splash.style.opacity = '0';
      setTimeout(function () { splash.style.display = 'none'; }, 300);
    });
    frame.src = APP_URL;
    setTimeout(function () { if (splash.style.display !== 'none') fb.hidden = false; }, 15000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  })();
</script>
</body>
</html>
